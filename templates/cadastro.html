<h1>Cadastro</h1>

<form method="post">

    <input
        name="nome"
        placeholder="Nome"
        required
    >

    <br><br>

    <input
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        name="senha"
        type="password"
        placeholder="Senha"
        required
    >

    <br><br>

    <button>Cadastrar</button>

</form>
